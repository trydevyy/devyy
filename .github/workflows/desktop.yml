name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev xvfb
      - run: npm ci
      - run: npx vitest run
      - run: npm run test:extension-host
      - name: Rust tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: devyy-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
