name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
    secrets:
      HIT_READ_PAT:
        required: true
      DEVYY_CRASH_WEBHOOK_URL:
        required: false
      DEVYY_FEEDBACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: devyy-desktop-${{ github.ref }}-${{ inputs.release_build == true }}
  cancel-in-progress: ${{ !inputs.release_build }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
      browser: ${{ steps.scope.outputs.browser }}
      installer: ${{ steps.scope.outputs.installer }}
      native: ${{ steps.scope.outputs.native }}
      installer_native: ${{ steps.scope.outputs.installer_native }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.release_build && github.event_name != 'workflow_dispatch' }}
        with:
          fetch-depth: 2
          # Only this metadata-only job needs credentials for a shallow base fetch.
          persist-credentials: true
      - id: scope
        shell: bash
        env:
          FULL: ${{ inputs.release_build || github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          browser=false
          installer=false
          native=false
          installer_native=false
          if [[ "$FULL" != true && "$BASE" =~ ^[0-9a-f]{40}$ && "$BASE" != 0000000000000000000000000000000000000000 ]] &&
            ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" || true
          fi
          if [[ "$FULL" == true ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            browser=true
            installer=true
            native=true
            installer_native=true
          else
            git diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/devyy-changed"
            while IFS= read -r -d '' file; do
              case "$file" in
                src-tauri/extension-host/*) browser=true; native=true ;;
                src-tauri/*|third_party/*) native=true ;;
                installer/src-tauri/*) installer=true; installer_native=true ;;
                installer/*) installer=true ;;
                .github/*|Makefile|.gitmodules|scripts/*)
                  browser=true; installer=true; native=true; installer_native=true ;;
                *.md|LICENSE|CODE_OF_CONDUCT*) ;;
                *) browser=true ;;
              esac
            done < "$RUNNER_TEMP/devyy-changed"
          fi
          {
            echo "full=$FULL"
            echo "browser=$browser"
            echo "installer=$installer"
            echo "native=$native"
            echo "installer_native=$installer_native"
          } >> "$GITHUB_OUTPUT"

  native-check:
    needs: scope
    if: >-
      needs.scope.outputs.full != 'true' &&
      (needs.scope.outputs.native == 'true' || needs.scope.outputs.installer_native == 'true') &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-hit
        if: needs.scope.outputs.native == 'true'
        with:
          token: ${{ secrets.HIT_READ_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: devyy-native-check-v2
          shared-key: linux-x64
          workspaces: |
            ${{ needs.scope.outputs.native == 'true' && 'src-tauri -> target' || 'installer/src-tauri -> ../../src-tauri/target' }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        if: needs.scope.outputs.native == 'true'
      - run: cargo fmt --manifest-path installer/src-tauri/Cargo.toml -- --check
        if: needs.scope.outputs.installer_native == 'true'
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - run: cargo check --locked --tests --manifest-path src-tauri/Cargo.toml
        if: needs.scope.outputs.native == 'true'
      - run: cargo check --locked --tests --manifest-path installer/src-tauri/Cargo.toml
        if: needs.scope.outputs.installer_native == 'true'

      - name: Remove private artifacts before saving the dependency cache
        if: github.ref == 'refs/heads/main' && needs.scope.outputs.native == 'true'
        run: cargo clean --locked --manifest-path src-tauri/Cargo.toml -p hit -p devyy

  release-native-tests:
    if: inputs.release_build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/fetch-hit
        with:
          token: ${{ secrets.HIT_READ_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev xvfb xauth
      - name: Test editor (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test editor and installer (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path installer/src-tauri/Cargo.toml

  desktop:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: windows-latest
            artifact: windows-x64
          - os: windows-latest
            artifact: windows-x86
            target: i686-pc-windows-msvc
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        if: inputs.release_build
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        if: inputs.release_build
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: inputs.release_build
        with:
          bun-version: 1.4.3
      - uses: ./.github/actions/fetch-hit
        with:
          token: ${{ secrets.HIT_READ_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: devyy-cargo-v1
          shared-key: ${{ matrix.artifact }}
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> ../../src-tauri/target
          # Release builds can embed webhooks and link the private HIT source.
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.release_build }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libxdo-dev xvfb xdotool
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - name: Test editor (Linux)
        if: runner.os == 'Linux' && !inputs.release_build
        run: xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test editor and installer (Windows)
        if: runner.os == 'Windows' && !inputs.release_build
        shell: bash
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ -n "$DEVYY_RUST_TARGET" ]]; then args+=(--target "$DEVYY_RUST_TARGET"); fi
          cargo test --locked --manifest-path src-tauri/Cargo.toml "${args[@]}"
          cargo test --locked --manifest-path installer/src-tauri/Cargo.toml "${args[@]}"
      - run: bun install --frozen-lockfile
        if: inputs.release_build
      - name: Build editor
        if: inputs.release_build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              args=(--no-bundle)
              if [[ -n "$DEVYY_RUST_TARGET" ]]; then args+=(--target "$DEVYY_RUST_TARGET"); fi
              bun run desktop:build "${args[@]}"
              ;;
            *) bun run desktop:build ;;
          esac
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
          DEVYY_CRASH_WEBHOOK_URL: ${{ inputs.release_build && secrets.DEVYY_CRASH_WEBHOOK_URL || '' }}
      - run: bun install --cwd installer --frozen-lockfile
        if: inputs.release_build && runner.os == 'Windows'
      - name: Build custom installer
        if: inputs.release_build && runner.os == 'Windows'
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
          DEVYY_FEEDBACK_WEBHOOK_URL: ${{ inputs.release_build && secrets.DEVYY_FEEDBACK_WEBHOOK_URL || '' }}
        run: node installer/scripts/release.mjs --skip-editor-build
      - name: Launch packaged editor on Linux
        if: inputs.release_build && runner.os == 'Linux'
        run: |
          xvfb-run -a bash -eu -o pipefail <<'BASH'
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          smoke() (
            "$1" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            timeout 45s xdotool search --sync --onlyvisible --name "^$2$"
            sleep 3
            kill -0 "$pid"
          )
          bundle=src-tauri/target/release/bundle/appimage
          smoke "$(find "$bundle" -iname 'devyy_*.AppImage' -print -quit)" Devyy
          BASH
      - name: Stage versioned installer and editor assets
        if: inputs.release_build
        shell: bash
        env:
          DEVYY_PLATFORM: ${{ matrix.artifact }}
          DEVYY_RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/stage-release-assets.sh
      - uses: actions/upload-artifact@v7
        if: inputs.release_build
        with:
          name: devyy-package-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: release-assets/

  macos:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ inputs.release_build && 'macos-15' || matrix.os }}
    timeout-minutes: 75
    env:
      DEVYY_PLATFORM: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        if: inputs.release_build
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        if: inputs.release_build
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: inputs.release_build
        with:
          bun-version: 1.4.3
      - uses: ./.github/actions/fetch-hit
        with:
          token: ${{ secrets.HIT_READ_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Intel macOS target
        if: inputs.release_build && matrix.artifact == 'macos-x64'
        run: rustup target add x86_64-apple-darwin
      - name: Test editor on macOS
        if: ${{ !inputs.release_build }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and stage ad hoc signed macOS release
        if: inputs.release_build
        shell: bash
        env:
          DEVYY_CRASH_WEBHOOK_URL: ${{ secrets.DEVYY_CRASH_WEBHOOK_URL }}
          DEVYY_MACOS_TARGET: ${{ matrix.artifact == 'macos-x64' && 'x86_64-apple-darwin' || '' }}
        run: bash scripts/build-local-release.sh --ad-hoc
      - uses: actions/upload-artifact@v7
        if: inputs.release_build
        with:
          name: devyy-package-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: release-assets/v*/${{ matrix.artifact }}/

  interface:
    needs: scope
    if: needs.scope.outputs.browser == 'true' || needs.scope.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FULL: ${{ needs.scope.outputs.full }}
      BROWSER: ${{ needs.scope.outputs.browser }}
      INSTALLER: ${{ needs.scope.outputs.installer }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        if: env.FULL == 'true'
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun install --cwd installer --frozen-lockfile
        if: env.INSTALLER == 'true'
      - run: make format-check-js
      - name: Check editor types and unit tests
        if: env.BROWSER == 'true'
        run: |
          bun run assets:generate
          bun x tsc -b
          make test-js
      - run: bun x playwright install --with-deps --only-shell chromium
      - name: Browser smoke tests
        if: env.BROWSER == 'true' && env.FULL != 'true'
        run: bun x playwright test tests/workbench-redesign.spec.ts tests/editor.spec.ts tests/ai.spec.ts --workers=2 --grep 'desktop panels use compact|create and rename files|rapid editor jumps'
      - name: Full editor browser suite
        if: env.FULL == 'true'
        run: |
          workers=2
          if [[ "$(nproc)" -ge 4 ]]; then workers=3; fi
          bun x playwright test --workers="$workers"
      - name: Installer browser tests
        if: env.INSTALLER == 'true'
        run: bun run --cwd installer test:e2e --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: devyy-interface-failures
          path: |
            test-results/
            installer/test-results/
