name: Desktop checks and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish GitHub Release"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  desktop:
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev xvfb
      - run: npm ci
      - run: npx vitest run
      - run: npm run test:extension-host
      - name: Rust tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        if: runner.os != 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build
      - run: npm ci --prefix installer
      - name: Installer engine tests
        if: runner.os != 'Linux'
        run: cargo test --manifest-path installer/src-tauri/Cargo.toml
      - name: Installer engine tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --manifest-path installer/src-tauri/Cargo.toml
      - name: Build custom installer
        env:
          DEVYY_FEEDBACK_WEBHOOK_URL: ${{ secrets.DEVYY_FEEDBACK_WEBHOOK_URL }}
        run: node installer/scripts/release.mjs --skip-editor-build
      - uses: actions/upload-artifact@v4
        with:
          name: devyy-${{ runner.os }}
          path: |
            src-tauri/target/release/devyy
            src-tauri/target/release/devyy.exe
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.zip
            src-tauri/target/release/bundle/installer/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix installer
      - run: npx playwright install --with-deps chrome
      - run: npm run assets:generate
      - run: npx playwright test --workers=2
      - run: npm run test:e2e --prefix installer -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: devyy-interface-failures
          path: test-results/

  release:
    needs: [desktop, interface]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Flatten release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/ \;
          ls -la dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
