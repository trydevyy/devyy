name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
    secrets:
      HIT_READ_PAT:
        required: true
      DEVYY_CRASH_WEBHOOK_URL:
        required: false
      DEVYY_FEEDBACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: devyy-desktop-${{ github.ref }}-${{ inputs.release_build == true }}
  cancel-in-progress: ${{ !inputs.release_build }}

jobs:
  desktop:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: windows-latest
            artifact: windows-x64
          - os: windows-latest
            artifact: windows-x86
            target: i686-pc-windows-msvc
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        if: inputs.release_build
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        if: inputs.release_build
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: inputs.release_build
        with:
          bun-version: 1.4.3
      - uses: ./.github/actions/fetch-hit
        with:
          token: ${{ secrets.HIT_READ_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: devyy-cargo-v1
          shared-key: ${{ matrix.artifact }}
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> ../../src-tauri/target
          # Release builds can embed webhooks and link the private HIT source.
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.release_build }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libxdo-dev xvfb xdotool
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - name: Test editor and installer (Linux)
        if: runner.os == 'Linux'
        run: make test-rust
      - name: Test editor and installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ -n "$DEVYY_RUST_TARGET" ]]; then args+=(--target "$DEVYY_RUST_TARGET"); fi
          cargo test --manifest-path src-tauri/Cargo.toml "${args[@]}"
          cargo test --manifest-path installer/src-tauri/Cargo.toml "${args[@]}"
      - run: bun install --frozen-lockfile
        if: inputs.release_build
      - name: Build editor
        if: inputs.release_build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              args=(--no-bundle)
              if [[ -n "$DEVYY_RUST_TARGET" ]]; then args+=(--target "$DEVYY_RUST_TARGET"); fi
              bun run desktop:build "${args[@]}"
              ;;
            *) bun run desktop:build ;;
          esac
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
          DEVYY_CRASH_WEBHOOK_URL: ${{ inputs.release_build && secrets.DEVYY_CRASH_WEBHOOK_URL || '' }}
      - run: bun install --cwd installer --frozen-lockfile
        if: inputs.release_build
      - name: Build custom installer
        if: inputs.release_build
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
          DEVYY_FEEDBACK_WEBHOOK_URL: ${{ inputs.release_build && secrets.DEVYY_FEEDBACK_WEBHOOK_URL || '' }}
        run: node installer/scripts/release.mjs --skip-editor-build
      - name: Launch packaged editor and installer on Linux
        if: inputs.release_build && runner.os == 'Linux'
        run: |
          xvfb-run -a bash -eu -o pipefail <<'BASH'
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          smoke() (
            "$1" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            timeout 45s xdotool search --sync --onlyvisible --name "^$2$"
            sleep 3
            kill -0 "$pid"
          )
          bundle=src-tauri/target/release/bundle/appimage
          smoke "$(find "$bundle" -iname 'devyy_*.AppImage' -print -quit)" Devyy
          smoke src-tauri/target/release/bundle/installer/Devyy-Setup.AppImage 'Devyy Installer'
          BASH
      - name: Stage versioned installer and editor assets
        if: inputs.release_build
        shell: bash
        env:
          DEVYY_PLATFORM: ${{ matrix.artifact }}
          DEVYY_RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/stage-release-assets.sh
      - uses: actions/upload-artifact@v7
        if: inputs.release_build
        with:
          name: devyy-package-${{ matrix.artifact }}
          if-no-files-found: error
          path: release-assets/

  macos:
    if: inputs.release_build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      DEVYY_PLATFORM: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: ./.github/actions/fetch-hit
        with:
          token: ${{ secrets.HIT_READ_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and stage ad hoc signed macOS release
        shell: bash
        env:
          DEVYY_CRASH_WEBHOOK_URL: ${{ secrets.DEVYY_CRASH_WEBHOOK_URL }}
        run: bash scripts/build-local-release.sh --ad-hoc
      - uses: actions/upload-artifact@v7
        with:
          name: devyy-package-${{ matrix.artifact }}
          if-no-files-found: error
          path: release-assets/v*/${{ matrix.artifact }}/

  interface:
    runs-on: ubuntu-24.04
    env:
      CAN_FETCH_HIT: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: ./.github/actions/fetch-hit
        if: env.CAN_FETCH_HIT == 'true'
        with:
          token: ${{ secrets.HIT_READ_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.CAN_FETCH_HIT == 'true'
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun install --cwd installer --frozen-lockfile
      - run: make format-check-rust
        if: env.CAN_FETCH_HIT == 'true'
      - run: make format-check-js test-js
      - name: Build browser workspace
        run: bun run build
      - run: bun x playwright install --with-deps --only-shell chromium
      - run: bun x playwright test --workers=2
      - run: bun run --cwd installer test:e2e --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: devyy-interface-failures
          path: |
            test-results/
            installer/test-results/
