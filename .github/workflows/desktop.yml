name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
    secrets:
      HIT_READ_PAT:
        required: true
      DEVYY_CRASH_WEBHOOK_URL:
        required: false
      DEVYY_FEEDBACK_WEBHOOK_URL:
        required: false

      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: devyy-desktop-${{ github.ref }}-${{ inputs.release_build == true }}
  cancel-in-progress: ${{ !inputs.release_build }}

jobs:
  desktop:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: windows-latest
            artifact: windows-x64
          - os: windows-latest
            artifact: windows-x86
            target: i686-pc-windows-msvc
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        if: inputs.release_build
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        if: inputs.release_build
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            installer/package-lock.json
      - name: Fetch pinned HIT source
        shell: bash
        env:
          HIT_READ_PAT: ${{ secrets.HIT_READ_PAT }}
        run: |
          if [[ -z "$HIT_READ_PAT" ]]; then
            echo "::error::Set HIT_READ_PAT to a token with read access to hit-scm/hit."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$HIT_READ_PAT" | base64 | tr -d '\r\n')"
          echo "::add-mask::$auth"
          git submodule sync -- third_party/hit
          GIT_TERMINAL_PROMPT=0 git -c url.https://github.com/hit-scm/hit.git.insteadOf=git@github.com:hit-scm/hit.git \
            -c "http.https://github.com/hit-scm/hit.git.extraHeader=Authorization: Basic $auth" \
            submodule update --init --checkout -- third_party/hit
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: devyy-cargo-v1
          shared-key: ${{ matrix.artifact }}
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> ../../src-tauri/target
          # Release builds can embed webhooks and link the private HIT source.
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.release_build }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libxdo-dev xvfb xdotool
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
      - name: Test editor and installer (Linux)
        if: runner.os == 'Linux'
        run: make test-rust
      - name: Test editor and installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ -n "$DEVYY_RUST_TARGET" ]]; then args+=(--target "$DEVYY_RUST_TARGET"); fi
          cargo test --locked --manifest-path src-tauri/Cargo.toml "${args[@]}"
          cargo test --locked --manifest-path installer/src-tauri/Cargo.toml "${args[@]}"
      - run: npm ci
        if: inputs.release_build
      - name: Build editor
        if: inputs.release_build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              args=(--no-bundle)
              if [[ -n "$DEVYY_RUST_TARGET" ]]; then args+=(--target "$DEVYY_RUST_TARGET"); fi
              npm run desktop:build -- "${args[@]}"
              ;;
            *) npm run desktop:build ;;
          esac
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
          DEVYY_CRASH_WEBHOOK_URL: ${{ inputs.release_build && secrets.DEVYY_CRASH_WEBHOOK_URL || '' }}
      - run: npm ci --prefix installer
        if: inputs.release_build
      - name: Build custom installer
        if: inputs.release_build
        env:
          DEVYY_RUST_TARGET: ${{ matrix.target }}
          DEVYY_FEEDBACK_WEBHOOK_URL: ${{ inputs.release_build && secrets.DEVYY_FEEDBACK_WEBHOOK_URL || '' }}
        run: node installer/scripts/release.mjs --skip-editor-build
      - name: Launch packaged editor and installer on Linux
        if: inputs.release_build && runner.os == 'Linux'
        run: |
          xvfb-run -a bash -eu -o pipefail <<'BASH'
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          smoke() (
            "$1" &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            timeout 45s xdotool search --sync --onlyvisible --name "^$2$"
            sleep 3
            kill -0 "$pid"
          )
          bundle=src-tauri/target/release/bundle/appimage
          smoke "$(find "$bundle" -iname 'devyy_*.AppImage' -print -quit)" Devyy
          smoke src-tauri/target/release/bundle/installer/Devyy-Setup.AppImage 'Devyy Installer'
          BASH
      - name: Stage versioned installer and editor assets
        if: inputs.release_build
        shell: bash
        env:
          DEVYY_PLATFORM: ${{ matrix.artifact }}
          DEVYY_RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/stage-release-assets.sh
      - uses: actions/upload-artifact@v7
        if: inputs.release_build
        with:
          name: devyy-package-${{ matrix.artifact }}
          if-no-files-found: error
          path: release-assets/

  macos:
    if: inputs.release_build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      DEVYY_PLATFORM: ${{ matrix.artifact }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch pinned HIT source
        shell: bash
        env:
          HIT_READ_PAT: ${{ secrets.HIT_READ_PAT }}
        run: |
          if [[ -z "$HIT_READ_PAT" ]]; then
            echo "::error::Set HIT_READ_PAT to a token with read access to hit-scm/hit."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$HIT_READ_PAT" | base64 | tr -d '\r\n')"
          echo "::add-mask::$auth"
          git submodule sync -- third_party/hit
          GIT_TERMINAL_PROMPT=0 git -c url.https://github.com/hit-scm/hit.git.insteadOf=git@github.com:hit-scm/hit.git \
            -c "http.https://github.com/hit-scm/hit.git.extraHeader=Authorization: Basic $auth" \
            submodule update --init --checkout -- third_party/hit
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?Set APPLE_SIGNING_IDENTITY}"
          : "${APPLE_ID:?Set APPLE_ID}"
          : "${APPLE_PASSWORD:?Set APPLE_PASSWORD}"
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID}"
          : "${APPLE_CERTIFICATE:?Set APPLE_CERTIFICATE}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Set APPLE_CERTIFICATE_PASSWORD}"
          keychain="$RUNNER_TEMP/devyy-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/devyy-signing.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 4500 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
      - name: Build, notarize, and stage macOS release
        shell: bash
        env:
          DEVYY_CRASH_WEBHOOK_URL: ${{ secrets.DEVYY_CRASH_WEBHOOK_URL }}
        run: bash scripts/build-local-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: devyy-package-${{ matrix.artifact }}
          if-no-files-found: error
          path: release-assets/v*/${{ matrix.artifact }}/

  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch pinned documentation
        run: git submodule update --init --checkout -- docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            installer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm ci --prefix installer
      - run: make format-check test-js
      - name: Build browser workspace without private HIT
        run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test --workers=2
      - run: npm run test:e2e --prefix installer -- --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: devyy-interface-failures
          path: |
            test-results/
            installer/test-results/
