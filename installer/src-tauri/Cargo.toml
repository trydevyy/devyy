[package]
name = "devyy-installer"
version = "0.1.0"
edition = "2021"
authors = ["Devyy contributors"]
description = "Install or uninstall Devyy"
homepage = "https://github.com/trydevyy/devyy"
repository = "https://github.com/trydevyy/devyy"
license = "GPL-3.0-only"
build = "build.rs"
[lib]
name = "devyy_installer"
crate-type = ["rlib", "cdylib", "staticlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.10"
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-drag = "2.1.1"
