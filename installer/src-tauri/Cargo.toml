[package]
name = "devyy-installer"
version = "0.1.0"
edition = "2021"
authors = ["Devyy contributors"]
description = "Install or uninstall Devyy"
homepage = "https://www.devyy.dev"
repository = "https://github.com/trydevyy/devyy"
license = "GPL-3.0-only"
build = "build.rs"
[lib]
name = "devyy_package"
crate-type = ["rlib", "cdylib", "staticlib"]
[[bin]]
name = "devyy-installer"
path = "src/main.rs"
test = false
[build-dependencies]
ring = "0.17"
tauri-build = { version = "2", features = [] }
serde_json = "1"
[dependencies]
ring = "0.17"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-drag = "2.1.1"
